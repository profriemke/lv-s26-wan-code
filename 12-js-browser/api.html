<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
</head>
<body>
    <span id="temp">---</span> C<br>
    <span id="hum">---</span> %<br>
    <span id="date"></span><br>
    <button>laden</button>
    

    <script>
        $('button').click(function(){
            console.log('click!')
            $.getJSON('https://demo.riemke.dev/api/air/get/', function(result){
                console.log(result)
                $('#temp').html(result.temp)
                $('#hum').html(result.hum)
                $('#date').html(result.date)
            })
        })
    </script>
</body>
</html>
