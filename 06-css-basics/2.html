<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .rotebox {
            width: 100px;
            height: 100px;
            margin: 10px;
            padding-top: 15px;
            padding-left: 5px;
            box-sizing: border-box;
            border: 10px solid yellow;
            background-color: red;
        }

        .blauebox {
            width: 100px;
            height: 100px;
            margin: 10px;
            padding-top: 15px;
            padding-left: 5px;
            box-sizing: border-box;
            border: 10px solid yellow;
            background-color: cornflowerblue;
        }

        #coralbox {
            width: 100px;
            height: 100px;
            margin: 10px;
            padding-top: 15px;
            padding-left: 5px;
            box-sizing: border-box;
            border: 10px solid cornflowerblue;
            background-color: coral;
        }
    </style>
</head>

<body>
    <div class="rotebox">Hallo</div>
    <div class="blauebox">Hallo</div>
    <div class="rotebox">Hallo</div>
    <div class="blauebox">Hallo</div>
    <div id="coralbox">Hallo</div>


    <h1 class="rotebox">Überschrift</h1>
</body>

</html>
