<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
        }
        #container{
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 2fr 1fr;
        }
        #header{
            background-color: rgb(99, 199, 99);
            grid-row: 1;
            grid-column: 1 /span 4;
        }
        #footer{
            background-color: rgb(130, 130, 241);
            grid-row: 3;
            grid-column: 2 /span 4;
        }
        #nav{
            background-color: rgb(218, 99, 99);
            grid-row: 2 /span 2;
            grid-column: 1;
        }
        #content{
            background-color: rgb(226, 189, 97);
            grid-row:2;
            grid-column: 2 /span 3;
        }

    </style>
   
</head>
<body>
    <div id="container">
        <div id="header">ich bin der Header</div>
        <div id="nav">ich bin die Navigation</div>
        <div id="content">ich bin der Content</div>
        <div id="footer">ich bin der Footer</div>
    </div>
</body>
</html>
